<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <div class="header-links">
      <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"/></svg>
      </a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"/></svg>
      </a>
    </div>
  </div>
</header>
